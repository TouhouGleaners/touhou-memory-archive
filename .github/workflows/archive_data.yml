name: Archive Data History

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/public/videos.json'

permissions:
  contents: write

jobs:
  archive-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate Dynamic Variables
        id: calculate_vars
        env:
          TZ: Asia/Shanghai
        run: |
          # 计算日期和路径
          TODAY_FULL_DATE=$(date +'%Y-%m-%d')
          YEAR_MONTH=$(date +'%Y-%m')
          FILENAME="videos_$(date +'%Y%m%d').json"
          
          # 临时文件夹路径
          ARCHIVE_PATH="temp_archives/archives/$YEAR_MONTH/$FILENAME"
          
          # 构造提交信息
          COMMIT_MSG="Data update: $TODAY_FULL_DATE [skip ci]"
          
          # 将 Shell 变量保存到 Action 的 output 中
          echo "archive_path=$ARCHIVE_PATH" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Prepare Archive Data
        run: |
          # 引用上一步的 output
          TARGET_FULL_PATH="${{ steps.calculate_vars.outputs.archive_path }}"
          
          # 创建目录结构
          mkdir -p "$(dirname "$TARGET_FULL_PATH")"
          
          # 复制文件
          cp "frontend/public/videos.json" "$TARGET_FULL_PATH"
          
          echo "✅ Backup prepared at: $TARGET_FULL_PATH"
          ls -R temp_archives

      - name: Deploy to Data Archive Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data-archive
          folder: temp_archives
          target-folder: .
          clean: false
          commit-message: ${{ steps.calculate_vars.outputs.commit_msg }}