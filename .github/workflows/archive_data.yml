name: Auto Archive History

on:
  push:
    branches:
      - data-archive
    paths:
      - 'videos.json'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    
    steps:
      # 拉取 data-archive 的数据
      - name: Checkout data
        uses: actions/checkout@v4
        with:
          ref: data-archive

      # 在 data-archive 分支上创建归档文件
      - name: Create Snapshot
        id: create_snapshot
        env:
          TZ: Asia/Shanghai
        run: |
          YEAR_MONTH=$(date +'%Y-%m')
          FILENAME="videos_$(date +'%Y%m%d').json"
          COMMIT_MSG="CI: Archive $FILENAME"
          
          mkdir -p "archives/$YEAR_MONTH"
          cp videos.json "archives/$YEAR_MONTH/$FILENAME"
          
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      # 将归档提交到 data-archive
      - name: Push back to data-archive
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: data-archive
          folder: .
          commit-message: ${{ steps.create_snapshot.outputs.commit_msg }}
          clean: false