name: Deploy Website

on:
  push:
    branches:
      - main           # 触发器：代码更新时部署网站
      - data-archive   # 触发器：数据更新时部署网站
    paths-ignore:
      - 'archives/**'  # 忽略 archives 文件夹的变动

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 拉取 main 代码
      - name: Checkout Code (main)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 
          
      # 将 data-archive 拉到一个临时目录
      - name: Fetch Latest Data from Archive Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: data-archive # 从数据分支下载
          path: .data_temp  # 拉取到一个临时文件夹
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Data
        run: |
          # 检查文件是否存在
          if [ ! -f ".data_temp/videos.json" ]; then
             echo "Error: videos.json not found in data-archive branch. Deployment failed."
             exit 1
          fi
          # 将数据文件覆盖到前端 public 目录
          mv .data_temp/videos.json frontend/public/videos.json
          echo "✅ Latest data injected from data-archive."
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vue App
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist