name: Deploy Website

on:
  push:
    branches:
      - main
      - data-archive
    paths-ignore:
      - 'archives/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 拉取前端代码
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      # 拉取数据分支 videos.json
      - name: Fetch data from data-archive
        uses: actions/checkout@v4
        with:
          ref: data-archive
          path: .data_temp

      # 将数据文件注入到前端 public 目录
      - name: Inject videos.json
        run: |
          [ ! -f ".data_temp/videos.json" ] && echo "Error: videos.json not found" && exit 1
          mv .data_temp/videos.json frontend/public/videos.json
          rm -rf .data_temp

      # 安装依赖并构建
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install and Build
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist